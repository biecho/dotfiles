---
- name: Inspect dotfile sources
  ansible.builtin.stat:
    path: "{{ dotfiles_repo_dir }}/{{ item.src }}"
  loop: "{{ dotfiles_links }}"
  register: dotfiles_source_stats
  loop_control:
    label: "{{ item.src }}"

- name: Keep only links whose source exists
  ansible.builtin.set_fact:
    dotfiles_existing_links: >-
      {{
        dotfiles_source_stats.results
        | selectattr('stat.exists')
        | map(attribute='item')
        | list
      }}

- name: Inspect existing link targets
  ansible.builtin.stat:
    path: "{{ dotfiles_home }}/{{ item.dest }}"
    follow: false
  loop: "{{ dotfiles_existing_links }}"
  register: dotfiles_target_stats
  loop_control:
    label: "{{ item.dest }}"

- name: Ensure backup directory exists
  ansible.builtin.file:
    path: "{{ dotfiles_backup_dir }}"
    state: directory
    mode: "0755"
  when: dotfiles_backup_existing | bool

- name: Back up non-symlink targets before replacing them
  ansible.builtin.command:
    argv:
      - mv
      - "{{ item.stat.path }}"
      - "{{ dotfiles_backup_dir }}/{{ item.item.dest | replace('/', '__') }}"
  loop: "{{ dotfiles_target_stats.results }}"
  loop_control:
    label: "{{ item.item.dest }}"
  when:
    - dotfiles_backup_existing | bool
    - item.stat.exists
    - not item.stat.islnk
  changed_when: true

- name: Ensure parent directories exist
  ansible.builtin.file:
    path: "{{ (dotfiles_home + '/' + item.dest) | dirname }}"
    state: directory
    mode: "0755"
  loop: "{{ dotfiles_existing_links }}"
  loop_control:
    label: "{{ item.dest }}"

- name: Link dotfiles
  ansible.builtin.file:
    src: "{{ dotfiles_repo_dir }}/{{ item.src }}"
    dest: "{{ dotfiles_home }}/{{ item.dest }}"
    state: link
    force: true
  loop: "{{ dotfiles_existing_links }}"
  loop_control:
    label: "{{ item.dest }}"

# kitty's current-theme.conf is mutated at runtime by the theme picker, so it is
# seeded as a real copy (not a symlink) to keep theme switches out of the repo.
# current-theme.conf is gitignored; fall back to the tokyonight-storm default.
# force:false means an existing file — i.e. a theme you already picked — is kept.
- name: Seed kitty current-theme.conf from the repo default
  ansible.builtin.copy:
    src: >-
      {{
        (dotfiles_repo_dir + '/kitty/current-theme.conf')
        if (dotfiles_repo_dir + '/kitty/current-theme.conf') is file
        else (dotfiles_repo_dir + '/kitty/themes/tokyonight-storm.conf')
      }}
    dest: "{{ dotfiles_home }}/.config/kitty/current-theme.conf"
    remote_src: true
    force: false
    mode: "0644"

# termusic rewrites server.toml while it runs, recording an absolute music
# directory and a per-user socket path, so the live file is gitignored and
# seeded from the example instead of being tracked. It is seeded in the repo
# itself because that is what termusic/README.md links to.
# force:false means a config you already have is kept.
- name: Seed termusic server.toml from the repo example
  ansible.builtin.copy:
    src: "{{ dotfiles_repo_dir }}/termusic/server.toml.example"
    dest: "{{ dotfiles_repo_dir }}/termusic/server.toml"
    remote_src: true
    force: false
    mode: "0644"
  when: dotfiles_install_termusic | bool

- name: Install yazi packages when ya is available
  ansible.builtin.command:
    argv:
      - ya
      - pkg
      - install
  register: dotfiles_yazi_pkg
  failed_when: false
  changed_when: "'Installed' in (dotfiles_yazi_pkg.stdout | default(''))"
